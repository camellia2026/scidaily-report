name: weekly-journal-roundup

# ============================================================
# 每周顶刊盘点。
#
# 为什么日报之外还要有这个：
#   顶层期刊的出版节奏差异极大。Nature/Science/NEJM/Lancet/JAMA 几乎每天更新，
#   但 TPAMI/IJCV 按月、JMLR 不定期、Acta Numerica **一年一卷**、SISC 双月。
#   日报的 72 小时窗口对慢刊几乎永远是空的——那不是「没新闻」，是窗口太窄。
#
# 与日报的三个关键差异：
#   1. 窗口 14 天（慢刊），若一无所获自动放宽到 90 天
#   2. **不参与跨天去重**：它是回顾，不是新条目。
#      改用 last_weekly_date 防止同一周重复出
#   3. 产出是归纳（「本周 TPAMI 上线 N 篇，最值得关注的几篇」），不是新条目列表
# ============================================================

on:
  schedule:
    # 周日北京时间 08:13 = 周六 00:13 UTC
    - cron: "13 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑不推送、不提交"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: weekly-journal-roundup
  cancel-in-progress: false

env:
  SCIDAILY_ENV: ${{ vars.SCIDAILY_ENV || 'ci' }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  SCIDAILY_CONTACT: ${{ vars.SCIDAILY_CONTACT || 'noreply@example.com' }}

  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
  LLM_FALLBACK_PROVIDER: ${{ vars.LLM_FALLBACK_PROVIDER || 'github' }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
  DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
  GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_MODELS_URL: ${{ vars.GITHUB_MODELS_URL || 'https://models.github.ai/inference' }}
  GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}
  NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

  MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.qq.com' }}
  MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
  MAIL_TO: ${{ secrets.MAIL_TO }}

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成盘点
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python run.py weekly $args

      - name: 提交盘点
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports data
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi
          git commit -m "roundup: $(TZ=Asia/Shanghai date +%F) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
