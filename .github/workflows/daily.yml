name: daily-science-frontier

# ============================================================
# 关于「每天早上 7 点」的诚实说明
#
# **GitHub Actions 做不到准点。** 这不是配置问题，是它的设计：
#   - cron 只认 UTC。北京 05:23 = 23:21 UTC（前一天）
#   - 官方文档明确写了：定时任务在高负载时会延迟，整点尤其严重。
#     社区实测普遍延迟数分钟到数小时
#   - 定时任务只在默认分支跑，fork 里不跑，最短间隔 5 分钟
#   - 公开仓库连续 60 天无活动会自动禁用定时任务
#
# 所以这里做了三层应对（与原项目一致，这些结论不随知识域改变）：
#   1. 避开整点：用 :23 / :47 而不是 :00——整点是全世界 cron 挤在一起的地方
#   2. 双 cron 兜底：第二条晚 84 分钟。报告已存在就只重试推送，自动 no-op
#   3. 幂等保证：「已生成**且**已推送」才算完成
#
# 准确的心理预期是「早上 5:20–7:30 之间送到」，不是 7:00 准点。
# ============================================================

on:
  schedule:
    # 北京时间 05:23
    - cron: "23 21 * * *"
    # 兜底：北京时间 06:47
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略「今天已生成并推送」，强制重跑"
        type: boolean
        default: false
      dry_run:
        description: "只跑不推送、不提交"
        type: boolean
        default: false
      selftest:
        description: "只发一封渠道自检邮件，验证推送通不通"
        type: boolean
        default: false

permissions:
  contents: write   # 必需：要把 reports/ 与 data/ 提交回仓库
  models: read      # GitHub Models 兜底需要（若被拒，删掉这一行即可）

# 绝不取消进行中的运行。
# 中途取消可能留下「报告已提交但状态没提交」的中间态，那会污染第二天的去重。
concurrency:
  group: daily-science-frontier
  cancel-in-progress: false

env:
  SCIDAILY_ENV: ${{ vars.SCIDAILY_ENV || 'ci' }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

  # 学术 API 的礼貌池联系方式。缺了也能跑，但请填上。
  SCIDAILY_CONTACT: ${{ vars.SCIDAILY_CONTACT || 'noreply@example.com' }}

  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
  LLM_FALLBACK_PROVIDER: ${{ vars.LLM_FALLBACK_PROVIDER || 'github' }}

  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
  DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}

  GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_MODELS_URL: ${{ vars.GITHUB_MODELS_URL || 'https://models.github.ai/inference' }}
  GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}

  # 可选：有 NCBI key 时 PubMed 从 3 req/s 提到 10 req/s
  NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

  MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.qq.com' }}
  MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
  MAIL_TO: ${{ secrets.MAIL_TO }}

  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # 浅克隆会让 git pull --rebase 报 "shallow update not allowed"
          fetch-depth: 0
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 渠道自检
        if: ${{ inputs.selftest }}
        run: python run.py selftest

      - name: 生成报告
        if: ${{ !inputs.selftest }}
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # 注意：不要写成 `[ cond ] && args=...`。
          # 那是 bash 的短路表达式，在 set -e 下当条件为假时
          # 整个命令返回非零，会让 step 直接中止。
          args=""
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python run.py $args

      - name: 提交报告与去重状态
        # always()：即使生成步骤失败，也要把已有的产物提交掉，
        # 否则下一次运行会看到不一致的状态。
        if: ${{ always() && !inputs.selftest && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A reports data

          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi

          git commit -m "report: $(TZ=Asia/Shanghai date +%F) [skip ci]"

          # --autostash：本地可能有未提交的产物（比如失败时留下的）
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: 上传运行产物
        if: ${{ always() && !inputs.selftest }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: |
            reports/
            data/history/
          retention-days: 14
          if-no-files-found: warn

      - name: 把运行摘要写到 run 页面
        if: ${{ always() && !inputs.selftest }}
        run: python -m scidaily.summary >> "$GITHUB_STEP_SUMMARY" || true

      - name: 失败时告警
        if: ${{ failure() && !inputs.selftest && !inputs.dry_run }}
        run: |
          python run.py --alert "报告生成失败。查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: 死手开关
        # healthchecks.io 之类的服务：跑成功就 ping 一下。
        # 到点没 ping 就说明任务根本没跑起来——这是 cron 静默失败唯一的解药。
        if: ${{ success() && !inputs.selftest && !inputs.dry_run }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || true
          fi
